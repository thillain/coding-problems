name: Jira - Create & Start Story
on:
  push:
    branches-ignore:
      - main
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync-jira:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Jira Login
        uses: atlassian/gajira-login@v3
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

      - name: Find Existing Issue
        id: find
        uses: atlassian/gajira-find-issue-key@v3
        with:
          string: "${{ github.ref_name }}"

      - name: Create Issue
        if: steps.find.outputs.issue == ''
        id: create
        uses: atlassian/gajira-create@v3
        with:
          project: LEETCS # Change to your Project Key
          issuetype: Story
          summary: "${{ github.event.head_commit.message }}"
          description: "LeetCode solution for branch: ${{ github.ref_name }}"

      - name: Transition to In Progress
        uses: atlassian/gajira-transition@v3
        with:
          # Uses the newly created key OR the one found on the branch
          issue: ${{ steps.create.outputs.issue || steps.find.outputs.issue }}
          transition: "In Progress"