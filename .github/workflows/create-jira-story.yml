name: Create Jira Story on Push

on:
  push:
    branches-ignore:
      - main
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  create-jira-story:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: atlassian/gajira-create@v4
        with:
          fetch-depth: 2  # needed to read commit message

      - name: Get commit info
        id: commit
        run: |
          # Get the commit title (first line)
          COMMIT_TITLE=$(git log -1 --pretty=format:"%s")
          # Get the commit body (everything after the first line)
          COMMIT_BODY=$(git log -1 --pretty=format:"%b")
          # Get the branch name
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"

          echo "title=$COMMIT_TITLE" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT

          # Multi-line body needs special handling
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMIT_BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Check if Jira story already exists for this branch
        id: check_existing
        run: |
          # Search for existing issue with this branch name in summary or label
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -u "${{ secrets.JIRA_USER_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.JIRA_BASE_URL }}/rest/api/3/search?jql=project=${{ secrets.JIRA_PROJECT_KEY }}+AND+labels=${{ steps.commit.outputs.branch }}")

          echo "status=$RESPONSE" >> $GITHUB_OUTPUT

      - name: Create Jira Story
        id: create_issue
        run: |
          BRANCH="${{ steps.commit.outputs.branch }}"
          TITLE="${{ steps.commit.outputs.title }}"
          BODY="${{ steps.commit.outputs.body }}"

          # Build description — use commit body if available, else a default
          if [ -z "$BODY" ]; then
            DESC_TEXT="Branch: $BRANCH"
          else
            DESC_TEXT="$BODY\n\nBranch: $BRANCH"
          fi

          PAYLOAD=$(jq -n \
            --arg project "${{ secrets.JIRA_PROJECT_KEY }}" \
            --arg summary "$TITLE" \
            --arg desc "$DESC_TEXT" \
            --arg branch "$BRANCH" \
            '{
              fields: {
                project: { key: $project },
                summary: $summary,
                description: {
                  type: "doc",
                  version: 1,
                  content: [
                    {
                      type: "paragraph",
                      content: [{ type: "text", text: $desc }]
                    }
                  ]
                },
                issuetype: { name: "Story" },
                labels: [$branch]
              }
            }')

          RESPONSE=$(curl -s \
            -X POST \
            -u "${{ secrets.JIRA_USER_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "${{ secrets.JIRA_BASE_URL }}/rest/api/3/issue")

          echo "Response: $RESPONSE"

          ISSUE_KEY=$(echo $RESPONSE | jq -r '.key')
          echo "issue_key=$ISSUE_KEY" >> $GITHUB_OUTPUT

          if [ "$ISSUE_KEY" == "null" ] || [ -z "$ISSUE_KEY" ]; then
            echo "❌ Failed to create Jira issue"
            exit 1
          fi

          echo "✅ Created Jira issue: $ISSUE_KEY"

      - name: Move Jira Story to In Progress
        run: |
          ISSUE_KEY="${{ steps.create_issue.outputs.issue_key }}"

          # Get available transitions
          TRANSITIONS=$(curl -s \
            -u "${{ secrets.JIRA_USER_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.JIRA_BASE_URL }}/rest/api/3/issue/$ISSUE_KEY/transitions")

          echo "Available transitions: $TRANSITIONS"

          # Find the "In Progress" transition ID (adjust name if your board uses a different label)
          TRANSITION_ID=$(echo $TRANSITIONS | jq -r '.transitions[] | select(.name == "In Progress") | .id')

          if [ -z "$TRANSITION_ID" ]; then
            echo "⚠️ 'In Progress' transition not found. Trying 'Start Progress'..."
            TRANSITION_ID=$(echo $TRANSITIONS | jq -r '.transitions[] | select(.name | test("progress|start|begin"; "i")) | .id' | head -1)
          fi

          if [ -z "$TRANSITION_ID" ]; then
            echo "⚠️ Could not find an In Progress transition. Skipping status update."
            exit 0
          fi

          curl -s \
            -X POST \
            -u "${{ secrets.JIRA_USER_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"transition\": {\"id\": \"$TRANSITION_ID\"}}" \
            "${{ secrets.JIRA_BASE_URL }}/rest/api/3/issue/$ISSUE_KEY/transitions"

          echo "✅ Moved $ISSUE_KEY to In Progress"