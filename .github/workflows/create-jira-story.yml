name: Jira - Create Story on Push
on:
  push:
    branches-ignore:
      - main
      - master

jobs:
  create-jira-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Parse Commit Message
        id: msg
        run: |
          # Extract first line for Title, rest for Description
          FULL_MSG="${{ github.event.head_commit.message }}"
          SUMMARY=$(echo "$FULL_MSG" | head -n 1)
          BODY=$(echo "$FULL_MSG" | sed '1d')
          echo "summary=$SUMMARY" >> $GITHUB_OUTPUT
          echo "body=${BODY:-'No description provided.'}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Create Jira Issue
        id: create
        run: |
          RESPONSE=$(curl --request POST \
            --url "${{ secrets.JIRA_BASE_URL }}/rest/api/2/issue" \
            --user "${{ secrets.JIRA_USER_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --data '{
              "fields": {
                "project": { "key": "PROJ" },
                "summary": "${{ steps.msg.outputs.summary }}",
                "description": "Commit: ${{ github.sha }}\n\n${{ steps.msg.outputs.body }}",
                "issuetype": { "name": "Story" }
              }
            }')
          
          # Extract the Issue Key (e.g., PROJ-123)
          ISSUE_KEY=$(echo $RESPONSE | jq -r '.key')
          echo "key=$ISSUE_KEY" >> $GITHUB_OUTPUT
          echo "Created Issue: $ISSUE_KEY"

      - name: Move to In Progress
        run: |
          curl --request POST \
            --url "${{ secrets.JIRA_BASE_URL }}/rest/api/2/issue/${{ steps.create.outputs.key }}/transitions" \
            --user "${{ secrets.JIRA_USER_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}" \
            --header 'Content-Type: application/json' \
            --data '{"transition": {"id": "11"}}' # Replace 11 with your 'In Progress' ID